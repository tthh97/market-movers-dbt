version: 2

models:
  - name: mart_movers
    description: Latest snapshot per ticker, ranked by 1-day return, with 5D and ~1M returns.
    columns:
      - name: ticker
        tests: [not_null, unique]

  - name: mart_momentum
    description: Trend (5d vs 20d MA), drawdown, and volatility-adjusted latest move.
    columns:
      - name: ticker
        tests: [not_null, unique]

  - name: mart_portfolio_bias
    description: Holdings only - correlation to Nasdaq (QQQ) and current drawdown.
    columns:
      - name: ticker
        tests: [not_null, unique]

  - name: mart_sector_overview
    description: One row per sector (benchmarks excluded) - name count, average returns, breadth, and best/worst mover.
    columns:
      - name: sector
        tests: [not_null, unique]
      - name: n_names
        tests: [not_null]

  - name: fct_price_alerts
    description: >
      One row per alert: a non-benchmark move that cleared an enabled rule in
      the alert_rules seed, strictest matching rule wins. Detection is SQL
      only; nothing downstream computes or changes these numbers.
    columns:
      - name: alert_id
        tests: [not_null, unique]
      - name: research_unit_id
        tests: [not_null]
      - name: ticker
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_watchlist')
                field: ticker
      - name: severity
        tests:
          - accepted_values:
              arguments:
                values: ['medium', 'high']
      - name: move_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['market_wide', 'sector', 'stock']

  - name: fct_alert_explanations
    description: >
      The latest explanation per alert from the research agent: cause,
      category, dated sources, confidence, and the verifier's verdict. Only
      alerts that still exist in fct_price_alerts are kept.
    columns:
      - name: alert_id
        tests: [not_null, unique]
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: ['earnings', 'guidance', 'regulatory', 'product', 'm_and_a',
                         'macro', 'sector_sympathy', 'crypto_specific',
                         'commodity_supply', 'unknown']
      - name: verifier_status
        tests:
          - accepted_values:
              arguments:
                values: ['verified', 'rejected']
