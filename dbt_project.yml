name: market_movers
version: "1.0.0"
config-version: 2

profile: market_movers

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # How far back the fct_prices incremental scan reaches from its high-water
  # mark, so late-arriving and corrected rows have somewhere to land. Anything
  # older than this is still dropped silently by the filter, which is what
  # assert_fct_prices_complete exists to make loud. ~570 rows at 30 days here.
  fct_prices_lookback_days: 30

models:
  market_movers:
    # Folder names carry the build order: staging -> fact -> intermediate -> marts.
    # fct_prices previously sat under marts/ but builds before both intermediate
    # models, so the folder name contradicted the DAG. Numbering settles it.
    # Quoted because a bare 01_staging is ambiguous to a YAML reader.
    "01_staging":
      +materialized: view
    "02_fact":
      # fct_prices overrides this with materialized="incremental" in its own
      # config block; this is only the fallback for anything else added here.
      +materialized: table
    "03_intermediate":
      +materialized: view
    "04_marts":
      +materialized: table

seeds:
  market_movers:
    watchlist:
      +column_types:
        is_holding: boolean
        is_benchmark: boolean
