name: market_movers
version: "1.0.0"
config-version: 2

profile: market_movers

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # How far back the fct_prices incremental scan reaches from its high-water
  # mark, so late-arriving and corrected rows have somewhere to land. Anything
  # older than this is still dropped silently by the filter, which is what
  # assert_fct_prices_complete exists to make loud. ~570 rows at 30 days here.
  fct_prices_lookback_days: 30

  # Price alerts. Detection is SQL and every knob lives here or in the
  # alert_rules seed, so a threshold change is a reviewed diff. Starting
  # values, to be tuned from alert volumes on real data, not guessed further.
  alert_vol_window_days: 60      # trailing returns used for a ticker's own volatility
  alert_min_history_days: 20     # fewer prior returns than this: no z, no alert
  scope_market_ticker: SPY       # the series that stands for "the market"
  scope_market_z: 2.0            # its |z| at or above this, same sign: market-wide
  scope_peer_z: 1.0              # a peer "moved with it" at |z| at or above this, same sign
  scope_peer_share: 0.5          # share of sector peers that must move with it: sector-wide

models:
  market_movers:
    # Folder names carry the build order: staging -> fact -> intermediate -> marts.
    # fct_prices previously sat under marts/ but builds before both intermediate
    # models, so the folder name contradicted the DAG. Numbering settles it.
    # Quoted because a bare 01_staging is ambiguous to a YAML reader.
    "01_staging":
      +materialized: view
    "02_fact":
      # fct_prices overrides this with materialized="incremental" in its own
      # config block; this is only the fallback for anything else added here.
      +materialized: table
    "03_intermediate":
      +materialized: view
    "04_marts":
      +materialized: table

seeds:
  market_movers:
    watchlist:
      +column_types:
        is_holding: boolean
        is_benchmark: boolean
    alert_rules:
      +column_types:
        z_threshold: double
        enabled: boolean
