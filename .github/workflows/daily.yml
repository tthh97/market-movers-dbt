name: daily-refresh

on:
  schedule:
    # 08:00 UTC on weekdays = 16:00 SGT (UTC+8), same calendar day.
    # That is 04:00 ET, before the US open, so each run ingests the most
    # recent settled close: Mon picks up Friday, Tue-Fri pick up the prior
    # weekday. Every session lands exactly once, one day behind.
    - cron: "0 8 * * 1-5"
  # A fault is a dispatch input rather than a long-lived demo branch. The three
  # demo/* branches this replaces had to be rebased after every structural
  # change, drifted stale, and left an open PR that put an intentional break one
  # click from main - PR #7 was merged by accident on 2026-07-26 and reverted in
  # 258fd50. An input cannot be merged.
  workflow_dispatch:
    inputs:
      inject_fault:
        description: "Break stage 1 on purpose, to demo the triage layer"
        type: choice
        required: false
        default: none
        options:
          - none
          - accepted_values   # test failure: a sector outside the allowed list
          - dup_ticker        # test failure: a duplicate key in the watchlist
          - renamed_column    # build failure: a model stops compiling

# The assisted-triage step 3 opens a GitHub issue on failure, which needs write
# access to issues. Everything else is read-only.
permissions:
  contents: read
  issues: write

# One refresh at a time. Two overlapping runs would race on the same Snowflake
# tables, and a slow run must not be cancelled halfway through a MERGE.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable: if
# it were ever moved, the new code would run inside the job that holds the
# Snowflake key. The trailing comment records the human-readable version.
jobs:
  # Stage 1 - offline logic check. No credentials, no network, no warehouse
  # spend. The synthetic seed exercises every model and all 26 tests, so a red
  # build here is always a real SQL or schema regression rather than a data or
  # connectivity problem. It gates stage 2 so a known-broken pipeline never
  # burns Snowflake credits.
  build-duckdb:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: duckdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Demo only, and only when asked for by hand. A scheduled run never reaches
      # this step, because `inputs` is empty for a schedule event. The fault goes
      # into stage 1 alone: it fails there, which gates stage 2 off, so the whole
      # demo costs nothing on Snowflake.
      - name: Inject a deliberate fault
        if: inputs.inject_fault != '' && inputs.inject_fault != 'none'
        run: python scripts/inject_fault.py "${{ inputs.inject_fault }}"

      - name: Seed synthetic sample
        run: python scripts/seed_sample.py

      - name: Build and test models
        run: dbt build --profiles-dir .

      # Only on failure - this is what the triage job diagnoses. A green offline
      # run has nothing worth keeping.
      - name: Upload dbt target (offline)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbt-target-duckdb
          path: target/
          retention-days: 14

  # Stage 2 - the real nightly refresh against Snowflake.
  build-snowflake:
    runs-on: ubuntu-latest
    needs: build-duckdb
    env:
      # Every warehouse identifier comes from a secret, not from source. These
      # are not credentials, but a public repo has no reason to advertise the
      # account's internal layout.
      DBT_TARGET: snowflake
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The connector wants the key as a file. Write it under RUNNER_TEMP, which
      # is wiped when the job ends, with umask 077 so it is never group- or
      # world-readable. The secret is passed through env rather than
      # interpolated into the script body, so its contents can never be parsed
      # as shell.
      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/sf_ci_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/sf_ci_key.p8" >> "$GITHUB_ENV"

      # Least privilege, enforced per step. The loader role may write the raw
      # landing schema but cannot read the analytics one; the transformer role
      # may read raw and build analytics but cannot write raw. Neither can reach
      # ACCOUNTADMIN - the CI user is a SERVICE user with
      # DEFAULT_SECONDARY_ROLES = ().
      - name: Ingest latest prices (loader role)
        env:
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_LOADER }}
        run: python ingest.py --period 6mo

      - name: Build and test models (transformer role)
        env:
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_TRANSFORMER }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: dbt build --profiles-dir .

      - name: Generate docs
        env:
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_TRANSFORMER }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: dbt docs generate --profiles-dir .

      - name: Upload dbt target (docs + run results)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbt-target-snowflake
          path: target/
          retention-days: 14

  # Stage 3 - assisted triage. Its own job, fired by `failure()`, so it runs for
  # whichever stage broke. This has to be a separate job: build-snowflake is
  # SKIPPED when build-duckdb fails, so a triage chain nested inside
  # build-snowflake would never run for a SQL or test regression - exactly the
  # class of failure it explains best. It PROPOSES; a human approves. It never
  # edits code and never self-heals.
  triage:
    runs-on: ubuntu-latest
    needs: [build-duckdb, build-snowflake]
    if: failure()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Whichever stage failed uploaded its target/. Only one can exist: the
      # gate means a duckdb failure skips snowflake, and duckdb uploads only on
      # failure. If neither produced one, capture_failure.py reports
      # "no_run_results" and says the failure happened before dbt ran.
      - name: Fetch dbt artifacts from the failed stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: dbt-target-*
          merge-multiple: true
          path: target

      # Step 1 (capture, no AI): turn dbt's own artifacts into one curated
      # failure_context.json for later diagnosis.
      - name: Capture failure context
        run: python scripts/triage/capture_failure.py

      - name: Upload failure context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-context
          path: failure_context.json
          retention-days: 14

      # Step 2 (diagnose): one Claude API call turns the failure context into a
      # proposed diagnosis with safety flags. Skips itself if the
      # ANTHROPIC_API_KEY secret is not set.
      - name: Diagnose failure (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/triage/diagnose_failure.py

      - name: Upload diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnosis
          path: diagnosis.json
          if-no-files-found: ignore
          retention-days: 14

      # Step 3 (propose): turn the diagnosis into a human-approval GitHub issue
      # so someone is actually notified, instead of digging through artifacts.
      - name: Propose fix (open issue)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/triage/propose_fix.py

      - name: Upload proposed fix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proposed-fix
          path: proposed_fix_issue.md
          if-no-files-found: ignore
          retention-days: 14
