name: dashboard-pages

# Publishes the marts as a static dashboard to GitHub Pages. Runs entirely on
# the offline DuckDB path: no credentials, no warehouse, so it can rebuild on
# every push to main. The page is a baked snapshot of synthetic data - there is
# no live database behind it, by design.
#
# The synthetic path is the point, not a limitation. This job holds no secret,
# so nothing here can leak one, and the public page carries no real position
# data. The same generator renders production against Snowflake in daily.yml,
# where the output stays a private artifact. One script, two surfaces, and the
# page says in plain words which one it is showing.
on:
  push:
    branches: [main]
    # Only rebuild when something that affects the page changed. A docs-only
    # commit does not need to redeploy Pages.
    paths:
      - "models/**"
      - "seeds/**"
      - "scripts/build_viz.py"
      - "scripts/seed_sample.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pages deploy needs these; nothing here writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer build should supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: duckdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same offline path as stage 1 of daily.yml: synthetic seed exercises
      # every model, so the dashboard reflects a real build of the DAG.
      - name: Seed synthetic sample
        run: python scripts/seed_sample.py

      - name: Build models
        run: dbt build --profiles-dir .

      # VIZ_TARGET is set explicitly rather than left to the default. The
      # generator defaults to Snowflake, and a Pages job that silently tried to
      # reach a warehouse would fail here for the right reason but for the
      # wrong-looking one.
      - name: Render dashboard
        env:
          VIZ_TARGET: duckdb
        run: python scripts/build_viz.py --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
