name: dashboard-pages

# Publishes the marts as a dashboard to GitHub Pages, keeping a snapshot from
# every build. Runs entirely on the offline DuckDB path: no credentials, no
# warehouse, so it can rebuild on every push to main. The page is a baked
# snapshot of synthetic data - there is no live database behind it, by design.
#
# Each run drops a dated snapshot into runs/ on the gh-pages branch and
# regenerates index.html (an archive of every snapshot, newest first). The
# branch accumulates the snapshot files, so the archive is the full history of
# builds; GitHub Pages serves the branch directly.
on:
  push:
    branches: [main]
    # Only rebuild when something that affects the page changed.
    paths:
      - "models/**"
      - "seeds/**"
      - "scripts/build_viz.py"
      - "scripts/build_index.py"
      - "scripts/seed_sample.py"
      - "docs/explainers/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only the gh-pages archive branch is written; contents:write covers the push.
permissions:
  contents: write

# One publish at a time; a newer build should supersede an in-flight one, and
# serialising avoids two runs racing to force-push the archive branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: duckdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same offline path as stage 1 of daily.yml: the synthetic seed exercises
      # every model, so the dashboard reflects a real build of the DAG.
      - name: Seed synthetic sample
        run: python scripts/seed_sample.py

      - name: Build models
        run: dbt build --profiles-dir .

      # VIZ_TARGET is set explicitly: the generator defaults to Snowflake, and a
      # Pages job that silently tried to reach a warehouse would fail here for
      # the right reason but for the wrong-looking one.
      - name: Render dashboard
        env:
          VIZ_TARGET: duckdb
        run: python scripts/build_viz.py --out exports/dashboard.html

      # Rebuild the whole archive each run: bring forward every existing
      # snapshot so the branch accumulates, add this build's, regenerate the
      # index, then force-push. The snapshot files are the archive; gh-pages
      # itself stays a single rolling commit so its history does not bloat.
      - name: Publish snapshot to the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d-%H%M)
          SHA=$(git rev-parse --short HEAD)

          rm -rf /tmp/site && mkdir -p /tmp/site/runs
          if git fetch --quiet origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C /tmp/site
          fi
          cp exports/dashboard.html "/tmp/site/runs/${STAMP}-${SHA}.html"

          # Explainers are copied fresh from main every run rather than being
          # carried forward from the branch, so main stays the single source of
          # truth: editing one here is a normal commit, and deleting one
          # actually removes it from the site instead of stranding a copy.
          rm -rf /tmp/site/explainers
          if [ -d docs/explainers ]; then
            cp -R docs/explainers /tmp/site/explainers
          fi

          touch /tmp/site/.nojekyll
          python scripts/build_index.py /tmp/site

          cd /tmp/site
          git init --quiet -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "dashboard snapshot ${STAMP}-${SHA}"
          git push --force --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
