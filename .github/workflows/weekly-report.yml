name: weekly-report

on:
  schedule:
    # Monday 10:00 UTC, two hours after the Monday daily-refresh (08:00 UTC),
    # which is the run that lands Friday's settled close. Any earlier and the
    # "week" the report covers would be missing its final session.
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      inject_fault:
        description: "Corrupt the draft on purpose, to demo the publication gate"
        type: choice
        required: false
        default: none
        options:
          - none
          - fabricated_number    # a figure that appears in no query result
          - flipped_direction    # one direction word inverted against the rows

# Read-only: the report is an artifact, not a commit. Nothing here needs write.
permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

# Same rule as daily.yml: third-party actions pinned to commit SHAs, because a
# tag is mutable and this job holds warehouse and API credentials.
jobs:
  # Stage 1 - the gate's own evals, offline. No API key, no warehouse, pure
  # stdlib fixtures. If the matcher or the gate rule has regressed, the
  # expensive stage below never spends a Claude call or a warehouse credit on
  # a report the gate can no longer be trusted to check. Same shape as
  # build-duckdb gating build-snowflake in daily.yml.
  gate-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gate evals (offline tier)
        working-directory: agent
        run: python report_evals.py --offline

  # Stage 2 - write, verify, gate, publish. The report agent connects with
  # the same read-only posture as the interactive agent: a dedicated service
  # user whose role holds USAGE + SELECT on the analytics schema and nothing
  # else. See docs/handoff-report-agent.md for the three agent secrets.
  weekly-report:
    runs-on: ubuntu-latest
    needs: gate-evals
    env:
      REPORT_TARGET: snowflake
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_AGENT_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_AGENT }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same handling as daily.yml: key under RUNNER_TEMP, umask 077, passed
      # through env so the secret's contents are never parsed as shell.
      - name: Write Snowflake private key
        env:
          SNOWFLAKE_AGENT_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_AGENT_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_AGENT_PRIVATE_KEY" > "$RUNNER_TEMP/sf_agent_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/sf_agent_key.p8" >> "$GITHUB_ENV"

      # On a scheduled run `inputs` is empty, so no fault is ever injected
      # into a real report. A dispatched fault run is EXPECTED to end red:
      # the demo is the gate blocking, and the failure JSON in the artifact
      # is the evidence.
      - name: Write, verify, gate
        working-directory: agent
        run: |
          if [ -n "${{ inputs.inject_fault }}" ] && [ "${{ inputs.inject_fault }}" != "none" ]; then
            python report.py --inject-fault "${{ inputs.inject_fault }}"
          else
            python report.py
          fi

      # Uploaded on success AND failure: a published report and a gate-failure
      # JSON are both outcomes worth keeping.
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-report
          path: reports/
          retention-days: 90
